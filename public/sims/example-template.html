<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The hub reads these two tags for the card title and blurb. -->
    <title>Example Template</title>
    <meta
      name="description"
      content="A placeholder sim showing the file conventions the hub reads. Delete it once your own sims are in public/sims/."
    />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 20px;
        padding: 32px;
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
        color: #0f172a;
        background: #f8fafc;
        text-align: center;
      }
      h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0; max-width: 40ch; color: #475569; }
      canvas { border-radius: 12px; background: #fff; border: 1px solid #e2e8f0; }
      label { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 14px; color: #475569; }
      input { accent-color: #f59e0b; }
    </style>
  </head>
  <body>
    <h1>Example simulation</h1>
    <p>
      This file is a placeholder so the hub has something to render. Replace it
      with your own standalone HTML sims in <code>public/sims/</code>.
    </p>
    <canvas id="stage" width="420" height="220"></canvas>
    <label>
      Temperature
      <input id="speed" type="range" min="1" max="100" value="35" />
    </label>

    <script>
      const ctx = document.querySelector('#stage').getContext('2d')
      const speed = document.querySelector('#speed')
      const particles = Array.from({ length: 60 }, () => ({
        x: Math.random() * 420,
        y: Math.random() * 220,
        a: Math.random() * Math.PI * 2,
      }))

      function frame() {
        const v = speed.value / 40
        ctx.clearRect(0, 0, 420, 220)
        ctx.fillStyle = '#f59e0b'
        for (const p of particles) {
          p.a += (Math.random() - 0.5) * 0.6
          p.x = (p.x + Math.cos(p.a) * v + 420) % 420
          p.y = (p.y + Math.sin(p.a) * v + 220) % 220
          ctx.beginPath()
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2)
          ctx.fill()
        }
        requestAnimationFrame(frame)
      }
      frame()
    </script>
  </body>
</html>
